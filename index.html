/* Layout: one column, phone first; each role is one screen with one big action. Colors come from the festival flyer. */
:root {
  color-scheme: dark;
  --navy: #292945;
  --navy-deep: #1f1f36;
  --navy-line: #3b3b60;
  --teal: #0f8ea6;
  --coral: #d84533;
  --paper: #fff9f6;
  --muted: #b9b8d6;
  --ok: #1f9d55;
  --warn: #e08a12;
  --bad: #c0392b;
  --display: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
  --body: "Archivo", "Segoe UI", Roboto, Arial, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--navy);
  color: var(--paper);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.4;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.4rem; }
h2 { font-size: 1.9rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .who { font-family: var(--display); font-size: 1.5rem; }
.linkbtn {
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 1rem;
  text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; cursor: pointer;
}

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 8px; }
.hero img { width: 120px; }
.band {
  background: var(--coral); color: #fff; font-weight: 800; padding: 6px 14px;
  font-size: 1.05rem; letter-spacing: 0.01em;
}

.btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; min-height: 72px; padding: 14px 20px; box-sizing: border-box;
  border: 0; border-radius: 18px; cursor: pointer;
  font: 800 1.35rem/1.2 var(--body); text-align: center;
  background: var(--paper); color: var(--navy);
  -webkit-tap-highlight-color: transparent;
}
.btn.coral { background: var(--coral); color: #fff; }
.btn.teal { background: var(--teal); color: #fff; }
.btn.ghost { background: transparent; color: var(--paper); border: 2px solid var(--navy-line); min-height: 60px; font-size: 1.1rem; }
.btn:active { transform: scale(0.98); }
.btn:focus-visible, .linkbtn:focus-visible, input:focus-visible, .opt:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.btn svg { width: 30px; height: 30px; flex: none; }
.btn .sub { display: block; font-weight: 400; font-size: 0.95rem; opacity: 0.8; }
.choices { display: flex; flex-direction: column; gap: 14px; }

label.field { display: flex; flex-direction: column; gap: 8px; font-weight: 600; }
input[type="text"] {
  font: 400 1.35rem var(--body); padding: 16px; border-radius: 14px;
  border: 2px solid var(--navy-line); background: var(--navy-deep); color: var(--paper); width: 100%;
  box-sizing: border-box;
}
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  padding: 14px 10px; border-radius: 14px; border: 2px solid var(--navy-line);
  background: var(--navy-deep); color: var(--paper); font: 600 1.1rem var(--body); cursor: pointer;
}
.opt[aria-pressed="true"] { border-color: var(--paper); background: var(--paper); color: var(--navy); }

.next {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-top: 1px solid var(--navy-line); border-bottom: 1px solid var(--navy-line); padding-block: 12px;
}
.next b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.fix { display: flex; gap: 10px; align-items: center; }
.fix input { width: 110px; font-size: 1.2rem; padding: 10px; }
.fix .btn { min-height: 52px; font-size: 1rem; width: auto; padding: 10px 18px; }

.ticket-img { width: 100%; border-radius: 16px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.hint { background: var(--navy-deep); border-radius: 14px; padding: 14px 16px; }
.err { color: #ffb3a8; font-weight: 600; }

.list { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  padding-block: 12px; border-bottom: 1px solid var(--navy-line);
}
.row .code { font-weight: 800; font-variant-numeric: tabular-nums; }
.row .name { min-width: 0; overflow-wrap: anywhere; }
.row .meta { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.row .linkbtn { padding: 4px 0; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--navy-deep); border-radius: 16px; padding: 14px 16px; }
.stat b { display: block; font-size: 2.2rem; font-variant-numeric: tabular-nums; line-height: 1.1; }

.cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 1 / 1; max-width: 100%; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .frame { position: absolute; inset: 15%; border: 4px solid rgba(255,255,255,0.85); border-radius: 18px; }

.result {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: center;
  gap: 18px; text-align: center; color: #fff;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.result.ok { background: var(--ok); }
.result.warn { background: var(--warn); }
.result.bad { background: var(--bad); }
.result.draw { background: var(--teal); }
.result .prize { font-size: 1.4rem; font-weight: 600; }

.reset { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px; }
.reset .linkbtn { color: #ff8a7a; font-size: 0.85rem; }
.confirm { background: var(--navy-deep); border: 2px solid var(--coral); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.confirm .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.confirm .btn { min-height: 56px; font-size: 1.05rem; }
.btn.danger { background: var(--bad); color: #fff; }
.row .place { font-weight: 800; color: var(--teal); font-variant-numeric: tabular-nums; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.result .big { font-family: var(--display); font-size: 4rem; line-height: 1; }
.result .code { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.result .name { font-size: 1.7rem; font-weight: 600; overflow-wrap: anywhere; }
.result .people { font-size: 1.5rem; }
.result .btn { max-width: 480px; margin: 0 auto; }
.result .linkbtn { color: #fff; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

// ---------- guardado en el teléfono ----------
const mem = {};
let storageOk = true;
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
  catch { storageOk = false; return key in mem ? mem[key] : fallback; }
}
function save(key, value) {
  mem[key] = value;
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { storageOk = false; }
}

const state = {
  role: load("ma.role", null),
  ticket: null,     // entrada recién creada {code,name,p,url}
  editing: false,
  doorResult: null,
  confirmReset: false,
  draw: null,       // sorteo en pantalla: {rolling:true} o el ganador
  doorSell: false,  // formulario de venta en puerta abierto
  doorTicket: null, // entrada vendida en puerta, en pantalla
};

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const codeOf = (series, n) => series + "-" + String(n).padStart(3, "0");
const peopleText = p => p === 1 ? "1 persona" : p + " personas";
const timeOf = t => new Date(t).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });

const icons = {
  ticket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v2M13 11v2M13 16v2"/></svg>',

function setRole(role) { state.role = role; save("ma.role", role); state.ticket = null; state.confirmReset = false; render(); }

function renderReset(what) {
  if (!state.confirmReset) return `
    <div class="reset"><button class="linkbtn" data-act="askReset">Empezar de cero</button></div>`;
  return `
    <div class="confirm" role="alertdialog" aria-labelledby="resetTitle">
      <h2 id="resetTitle">¿Seguro?</h2>
      <p>${what} No se puede deshacer.</p>
      <div class="btns">
        <button class="btn ghost" data-act="cancelReset">Cancelar</button>
        <button class="btn danger" data-act="doReset">Sí, borrar todo</button>
      </div>
    </div>`;
}
function doReset() {
  if (state.role === "door") { save("ma.door", {}); save("ma.winners", []); }
  state.confirmReset = false;
  render();
}

// ---------- la entrada (imagen) ----------
async function drawTicket(t) {
  try { await Promise.all([document.fonts.load('40px "Patrick Hand"'), document.fonts.load('800 40px "Archivo"'), document.fonts.load('400 40px "Archivo"')]); } catch {}
  if (!logoImg.complete) await new Promise(r => { logoImg.onload = r; logoImg.onerror = r; });

  const W = 1080, H = 1720;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");

  x.fillStyle = "#292945"; x.fillRect(0, 0, W, H);
  // círculos y líneas como en el flyer
  x.fillStyle = "#0f8ea6";
  x.beginPath(); x.arc(W + 40, 120, 230, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(-60, 520, 170, 0, Math.PI * 2); x.fill();
  x.fillStyle = "#d84533";
  x.beginPath(); x.arc(150, 90, 36, 0, Math.PI * 2); x.fill();
  x.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    x.strokeStyle = i % 2 ? "rgba(216,69,51,0.45)" : "rgba(15,142,166,0.55)";
    x.beginPath(); x.ellipse(W / 2, H + 380, 900 + i * 34, 700 + i * 30, -0.25, Math.PI, Math.PI * 2); x.stroke();
  }

  x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillStyle = "#fff9f6";
  const lw = 230, lh = lw * (logoImg.naturalHeight / logoImg.naturalWidth || 1.13);
  if (logoImg.naturalWidth) x.drawImage(logoImg, (W - lw) / 2, 60, lw, lh);

  let y = 60 + lh + 110;
  x.font = '400 118px "Patrick Hand", cursive';
  x.fillText(EVENT.title, W / 2, y);
  y += 62;
  x.font = '600 42px "Archivo", sans-serif';
  x.fillText(EVENT.tagline, W / 2, y);

  y += 50;
  x.fillStyle = "#d84533"; x.fillRect(70, y, W - 140, 84);
  x.fillStyle = "#fff"; x.font = '800 48px "Archivo", sans-serif';
  x.fillText(EVENT.date, W / 2, y + 59);
  y += 140;
  x.fillStyle = "#fff9f6"; x.font = '800 46px "Archivo", sans-serif';
  x.fillText(EVENT.place, W / 2, y);

  // talón blanco con el QR
  const top = y + 50, left = 70, cw = W - 140, ch = H - top - 70;
  x.fillStyle = "#fff9f6";
  x.beginPath(); x.roundRect(left, top, cw, ch, 36); x.fill();
  // muescas de entrada troquelada
  x.fillStyle = "#292945";
  x.beginPath(); x.arc(left, top + 120, 28, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(left + cw, top + 120, 28, 0, Math.PI * 2); x.fill();
  x.setLineDash([14, 12]); x.strokeStyle = "#c9c6dc"; x.lineWidth = 4;
  x.beginPath(); x.moveTo(left + 50, top + 120); x.lineTo(left + cw - 50, top + 120); x.stroke(); x.setLineDash([]);

  x.fillStyle = "#292945";
  x.font = '800 30px "Archivo", sans-serif';
  x.fillText("ENTRADA  N°", W / 2, top + 52);
  x.font = '800 54px "Archivo", sans-serif';
  x.fillText(t.code, W / 2, top + 100);

  const qr = qrcode(0, "M");
  qr.addData(payloadOf(t));
  qr.make();
  const n = qr.getModuleCount(), size = 440, cell = Math.floor(size / n), qs = cell * n;
  const qx = Math.round((W - qs) / 2), qy = top + 160;
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
    if (qr.isDark(r, col)) x.fillRect(qx + col * cell, qy + r * cell, cell, cell);
  }

  let ny = qy + qs + 70;
  let fs = 54;
  x.font = `600 ${fs}px "Archivo", sans-serif`;
  while (x.measureText(t.name).width > cw - 80 && fs > 28) { fs -= 2; x.font = `600 ${fs}px "Archivo", sans-serif`; }
  x.fillText(t.name, W / 2, ny);
  ny += 54;
  const test = isTest(t.code), atDoor = t.code.startsWith("P-");
  x.fillStyle = "#d84533"; x.font = '800 38px "Archivo", sans-serif';
  x.fillText(test ? "ENTRADA DE PRUEBA · NO SIRVE PARA ENTRAR" : "Válida para 1 persona", W / 2, ny);
  ny += 50;
  x.fillStyle = "#6b6a8a"; x.font = '400 30px "Archivo", sans-serif';
  x.fillText(atDoor ? "Guardá esta imagen: tu número participa del sorteo" : "Mostrá esta imagen en la puerta", W / 2, ny);

  return new Promise(res => c.toBlob(b => res(b), "image/png"));
}

function payloadOf(t) { return [PREFIX, t.code, t.p, encodeURIComponent(t.name)].join("|"); }
function parsePayload(text) {
  const parts = String(text || "").split("|");
  if (parts.length < 4 || parts[0] !== PREFIX || !/^[A-Z]-\d{3,}$/.test(parts[1])) return null;
  let name = parts.slice(3).join("|");
  try { name = decodeURIComponent(name); } catch {}
  return { code: parts[1], p: Number(parts[2]) || 1, name };
}

// ---------- vender ----------
// La numeración solo avanza: nunca vuelve atrás, así no se repiten números.
// Las entradas de prueba usan su propia serie (T-) y no tocan la numeración real.
function sold() { return load("ma.sold." + state.role, []); }
function nextNumber(series = state.role) { return load("ma.next." + series, 1); }
const isTest = code => String(code).startsWith("T-");

function takeCode(series) {
  const n = nextNumber(series);
  save("ma.next." + series, n + 1);
  return codeOf(series, n);
}

async function createTicket(name) {
  const t = { code: takeCode(state.role), name, p: 1, at: Date.now() };
  const list = sold(); list.unshift(t);
  save("ma.sold." + state.role, list);
  await showTicket(t);
}

async function createTestTicket() {
  const t = { code: takeCode("T"), name: "Prueba", p: 1, at: Date.now() };
  await showTicket(t);
}

async function showTicket(t) {
  const blob = await drawTicket(t);
  if (state.ticket?.url) URL.revokeObjectURL(state.ticket.url);
  state.ticket = { ...t, blob, url: URL.createObjectURL(blob) };
  render();
  window.scrollTo(0, 0);
}

async function shareTicket() {
  const t = state.ticket, msg = document.getElementById("shareMsg");
  const file = new File([t.blob], `Entrada ${t.code}.png`, { type: "image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: `Tu entrada para el Festival de Música Manos Abiertas (${t.code})` });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) {
      await dl.save({ filename: `Entrada ${t.code}.png`, data: t.blob });
      msg.textContent = "Listo. La imagen quedó en tu teléfono: ahora mandala por WhatsApp como cualquier foto.";
      return;
    }
  } catch (e) {
    if (e && e.code === "declined") return;
  }
  try {
    const a = document.createElement("a");
    a.href = t.url; a.download = `Entrada ${t.code}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch {}
  msg.textContent = "Mantené el dedo apretado sobre la entrada y elegí \"Guardar imagen\" o \"Compartir\".";
}

function renderSeller() {
  const t = state.ticket;
  const name = SELLERS[state.role];
  const head = `
    <div class="top">
      <span class="who">Vende ${esc(name)}</span>
      <button class="linkbtn" data-act="home">Cambiar</button>
    </div>`;

  if (t) {
    const test = isTest(t.code);
    return head + `
      <h2>${test ? "Entrada de prueba " + esc(t.code) : "Entrada " + esc(t.code) + " lista"}</h2>
      <img class="ticket-img" src="${t.url}" alt="Entrada ${esc(t.code)} de ${esc(t.name)}">
      <button class="btn coral" data-act="share">${icons.ticket}<span>Guardar o enviar la entrada</span></button>
      <p class="hint" id="shareMsg">${test
        ? "Escaneala con el teléfono de la puerta para probar. No usa ningún número real."
        : `Guardala en el teléfono y mandásela por WhatsApp a ${esc(t.name)} como una foto.`}</p>
      <button class="btn ghost" data-act="new">Hacer otra entrada</button>`;
  }

  const list = sold();
  const n = nextNumber();
  return head + `
    <form id="sellForm" class="choices" autocomplete="off">
      <h1>Nueva entrada</h1>
      <label class="field">Nombre de quien compra
        <input id="buyer" type="text" placeholder="Ej: María Gómez" enterkeyhint="done" required>
      </label>
      <p id="sellErr" class="err" hidden>Escribí el nombre de quien compra.</p>
      <button class="btn coral" type="submit">${icons.ticket}<span>Crear entrada</span></button>
    </form>
    <div class="next">
      <span class="muted">Número que sigue</span>
      <b>${codeOf(state.role, n)}</b>
      ${state.editing ? `
        <form id="fixForm" class="fix">
          <label class="visually-hidden" for="fixNum">Número que sigue</label>
          <input id="fixNum" type="text" inputmode="numeric" value="${n}">
          <button class="btn teal" type="submit">Guardar</button>
        </form>
        <p class="muted small">Solo se puede subir el número, nunca bajarlo, para que no se repitan entradas.</p>
        <p id="fixErr" class="err" hidden>Tiene que ser ${n} o más.</p>` : `<button class="linkbtn small" data-act="edit">Corregir número</button>`}
    </div>
    ${!storageOk ? `<p class="err">Este teléfono no deja guardar datos. Las entradas se crean bien, pero el número se reinicia al cerrar la página.</p>` : ""}
    <section class="choices">
      <h2>Entradas que hiciste${list.length ? ` (${list.length})` : ""}</h2>
      ${list.length ? `<div class="list">${list.map((s, i) => `
        <div class="row">
          <span class="code">${esc(s.code)}</span>
          <span class="name">${esc(s.name)}</span>
          <button class="linkbtn" data-act="reopen" data-i="${i}">Ver</button>
        </div>`).join("")}</div>`
      : `<p class="muted">Todavía no hiciste ninguna. Cuando crees la primera, aparece acá para que la puedas volver a mandar.</p>`}
    </section>
    <div class="reset">
      <button class="linkbtn" style="color:var(--muted)" data-act="testTicket">Hacer una entrada de prueba</button>
      <p class="muted small" style="text-align:center">Sale con número T-, no gasta números reales y no participa del sorteo.</p>
    </div>`;
}

// ---------- puerta ----------
let liveStream = null, scanning = false;
const canLive = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let liveFailed = false;

function entries() { return load("ma.door", {}); }

function registerScan(text) {
  const t = parsePayload(text);
  if (!t) { state.doorResult = { kind: "bad" }; render(); return; }
  admit(t);
}
function admit(t) {
  const all = entries();
  if (all[t.code]) {
    state.doorResult = { kind: "warn", ...all[t.code], code: t.code };
  } else {
    all[t.code] = { name: t.name, p: t.p, t: Date.now() };
    save("ma.door", all);
    state.doorResult = { kind: "ok", ...all[t.code], code: t.code };
  }
  if (navigator.vibrate) try { navigator.vibrate(state.doorResult.kind === "ok" ? 120 : [80, 60, 80]); } catch {}
  render();
}

function decodeFromSource(src, w, h) {
  const tries = [1200, 800, 1600];
  for (const max of tries) {
    const k = Math.min(1, max / Math.max(w, h));
    const cw = Math.round(w * k), ch = Math.round(h * k);
    const c = document.createElement("canvas"); c.width = cw; c.height = ch;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(src, 0, 0, cw, ch);
    const res = jsQR(x.getImageData(0, 0, cw, ch).data, cw, ch, { inversionAttempts: "attemptBoth" });
    if (res && res.data) return res.data;
  }
  return null;
}

async function onPhoto(file) {
  if (!file) return;
  const msg = document.getElementById("doorMsg");
  if (msg) msg.textContent = "Leyendo el QR…";
  try {
    const bmp = await createImageBitmap(file);
    const text = decodeFromSource(bmp, bmp.width, bmp.height);
    if (text) registerScan(text);
    else if (msg) msg.textContent = "No se pudo leer el QR. Sacá la foto más de cerca, derecha y con el brillo del celular del invitado al máximo.";
  } catch {
    if (msg) msg.textContent = "No se pudo abrir la foto. Probá de nuevo.";
  }
}

async function startLive() {
  if (!canLive || liveFailed) return false;
  try {
    if (!liveStream) liveStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    return true;
  } catch { liveFailed = true; liveStream = null; return false; }
}
function stopLive() {
  scanning = false;
  if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
}
function attachLive() {
  const v = document.getElementById("video");
  if (!v || !liveStream) return;
  v.srcObject = liveStream;
  v.play().catch(() => {});
  scanning = true;
  let last = 0;
  const loop = now => {
    if (!scanning || state.doorResult || state.draw || state.doorTicket || state.role !== "door") return;
    if (now - last > 220 && v.readyState >= 2) {
      last = now;
      const text = decodeFromSource(v, v.videoWidth, v.videoHeight);
      if (text) { registerScan(text); return; }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function normalizeCode(s) {
  const m = String(s).toUpperCase().replace(/\s/g, "").match(/^([A-Z])-?(\d{1,4})$/);
  return m ? codeOf(m[1], Number(m[2])) : null;
}

function renderResult() {
  const r = state.doorResult;
  if (r.kind === "bad") return `
    <div class="result bad" role="alert">
      <div class="big">No es válida</div>
      <p class="name">Este QR no es una entrada del festival.</p>
      <button class="btn" data-act="nextGuest">Escanear otra</button>
    </div>`;
  const ok = r.kind === "ok";
  return `
    <div class="result ${r.kind}" role="alert">
      <div class="big">${ok ? "¡Adelante!" : "Ya entró"}</div>
      <div class="code">${esc(r.code)}</div>
      ${r.name ? `<div class="name">${esc(r.name)}</div>` : ""}
      <div class="people">${!ok ? "Esta entrada ya se usó a las " + timeOf(r.t) : isTest(r.code) ? "Entrada de prueba: funciona, pero no cuenta ni participa del sorteo" : "Pasa 1 persona"}</div>
      <button class="btn" data-act="nextGuest">Siguiente</button>
      ${ok ? `<button class="linkbtn" data-act="undo" data-code="${esc(r.code)}">Me equivoqué, borrar este ingreso</button>` : ""}
    </div>`;
}

function renderDoor() {
  const all = entries();
  const rows = Object.entries(all).sort((a, b) => b[1].t - a[1].t);
  const real = rows.filter(([code]) => !isTest(code));
  const atDoor = real.filter(([code]) => code.startsWith("P-")).length;
  const live = !!liveStream;
  return `
    <div class="top">
      <span class="who">Puerta</span>
      <button class="linkbtn" data-act="home">Cambiar</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${real.length}</b><span class="muted">personas adentro</span></div>
      <div class="stat"><b>${atDoor}</b><span class="muted">vendidas en puerta</span></div>
    </div>
    ${live ? `
      <div class="cam"><video id="video" playsinline muted></video><div class="frame"></div></div>
      <p class="hint">Apuntá al QR del celular del invitado. Se lee solo.</p>`
    : `
      <label class="btn coral" for="photo">${icons.camera}<span>Escanear entrada<span class="sub">Sacale una foto al QR</span></span></label>
      <p class="hint" id="doorMsg">Tocá el botón, sacale una foto al QR que te muestra el invitado y confirmá la foto.</p>`}
    ${!storageOk ? `<p class="err">Este teléfono no deja guardar datos: no cierres esta página durante el evento.</p>` : ""}
    <details>
      <summary class="muted" style="cursor:pointer;padding-block:8px">¿No se lee el QR? Escribí el número</summary>
      <form id="manualForm" class="fix" style="margin-top:10px">
        <label class="visually-hidden" for="manualCode">Número de entrada</label>
        <input id="manualCode" type="text" placeholder="C-012" autocapitalize="characters" style="width:140px">
        <button class="btn teal" type="submit">Revisar</button>
      </form>
      <p id="manualErr" class="err" hidden>Escribilo así: una letra y el número, por ejemplo C-012.</p>
    </details>
    ${state.doorSell ? `
      <form id="doorSellForm" class="confirm" autocomplete="off" style="border-color:var(--teal)">
        <h2>Venta en puerta</h2>
        <p>Primero cobrá. Después creá la entrada: la persona queda anotada como que ya entró.</p>
        <label class="field">Nombre (si no lo querés anotar, dejalo vacío)
          <input id="doorBuyer" type="text" placeholder="Ej: Juan Pérez" enterkeyhint="done">
        </label>
        <div class="btns">
          <button type="button" class="btn ghost" data-act="cancelDoorSell">Cancelar</button>
          <button type="submit" class="btn teal">Crear entrada ${codeOf("P", nextNumber("P"))}</button>
        </div>
      </form>`
    : `<button class="btn ghost" data-act="doorSell">${icons.ticket}<span>Vender entrada en puerta</span></button>`}
    ${renderRaffle()}
    <section class="choices">
      <h2>Ya entraron</h2>
      ${rows.length ? `<div class="list">${rows.map(([code, e]) => `
        <div class="row">
          <span class="code">${esc(code)}</span>
          <span class="name">${esc(e.name || "Sin nombre")}${isTest(code) ? `<br><span class="meta">prueba</span>` : code.startsWith("P-") ? `<br><span class="meta">vendida en puerta</span>` : ""}</span>
          <span class="meta">${timeOf(e.t)}</span>
        </div>`).join("")}</div>`
      : `<p class="muted">Cuando escanees la primera entrada aparece acá, con la hora en que entró.</p>`}
    </section>
    ${renderReset("Se borran todos los ingresos y los ganadores del sorteo. Usalo solo después de probar, antes de que empiece el evento. La numeración de las ventas en puerta sigue donde estaba, para que no se repita ningún número.")}`;
}

// ---------- venta en puerta ----------
async function sellAtDoor(name) {
  const code = takeCode("P");
  const all = entries();
  all[code] = { name, p: 1, t: Date.now() };
  save("ma.door", all);
  const t = { code, name: name || "Entrada en puerta", p: 1 };
  const blob = await drawTicket(t);
  if (state.doorTicket?.url) URL.revokeObjectURL(state.doorTicket.url);
  state.doorSell = false;
  state.doorTicket = { ...t, url: URL.createObjectURL(blob) };
  render();
}

function renderDoorTicket() {
  const t = state.doorTicket;
  return `
    <div class="result draw" role="alert" style="justify-content:flex-start;overflow-y:auto">
      <div class="big">Entrada ${esc(t.code)}</div>
      <p class="people">Ya quedó anotada como que entró. Pedile que le saque una foto con su celular: con ese número participa del sorteo.</p>
      <img class="ticket-img" src="${t.url}" alt="Entrada ${esc(t.code)}" style="max-width:340px;margin:0 auto">
      <button class="btn" data-act="closeDoorTicket">Listo</button>
    </div>`;
}

// ---------- sorteo ----------
function winners() { return load("ma.winners", []); }
function rafflePool() {
  const won = new Set(winners().map(w => w.code));
  return Object.entries(entries()).filter(([code]) => !won.has(code) && !isTest(code));
}
function randomIndex(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  catch { return Math.floor(Math.random() * n); }
}

function renderRaffle() {
  const pool = rafflePool(), list = winners();
  const total = Object.keys(entries()).filter(code => !isTest(code)).length;
  let note;
  if (!total) note = "Participan las entradas que ya pasaron por la puerta. Todavía no entró nadie.";
  else if (!pool.length) note = "Ya ganaron todas las entradas que entraron. No queda nadie para sortear.";
  else note = `Participan ${pool.length === 1 ? "1 entrada" : pool.length + " entradas"} de las que entraron. Las que ya ganaron no vuelven a participar.`;
  return `
    <section class="choices">
      <h2>Sorteo</h2>
      <p class="muted">${note}</p>
      <button class="btn teal" data-act="draw" ${pool.length ? "" : "disabled"}>Sortear un premio</button>
      ${list.length ? `<div class="list">${list.map((w, i) => `
        <div class="row">
          <span class="place">${i + 1}°</span>
          <span class="name"><b>${esc(w.code)}</b> ${esc(w.name || "")}</span>
          <span class="meta">${timeOf(w.t)}</span>
        </div>`).join("")}</div>` : ""}
    </section>`;
}

function startDraw() {
  const pool = rafflePool();
  if (!pool.length) return;
  const [code, e] = pool[randomIndex(pool.length)];
  const list = winners();
  const w = { code, name: e.name || "", p: e.p || 1, t: Date.now() };
  list.push(w);
  save("ma.winners", list);
  state.draw = { ...w, place: list.length, rolling: true };
  render();

  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.getElementById("drawCode");
  let ticks = reduce ? 0 : 18;
  const spin = () => {
    if (!state.draw || !state.draw.rolling) return;
    if (ticks-- > 0 && el) {
      el.textContent = pool[randomIndex(pool.length)][0];
      setTimeout(spin, 90);
    } else {
      state.draw.rolling = false;
      if (navigator.vibrate) try { navigator.vibrate(200); } catch {}
      render();
    }
  };
  spin();
}

function renderDraw() {
  const d = state.draw;
  return `
    <div class="result draw" role="alert">
      <div class="prize">${d.place}° premio</div>
      <div class="big">${d.rolling ? "Sorteando…" : "¡Ganó!"}</div>
      <div class="code" id="drawCode">${esc(d.code)}</div>
      ${d.rolling ? "" : `
        ${d.name ? `<div class="name">${esc(d.name)}</div>` : ""}
        <button class="btn" data-act="closeDraw">Listo</button>`}
    </div>`;
}

// ---------- inicio ----------
function renderHome() {
  return `
    <div class="hero">
      <img src="${LOGO}" alt="Manos Abiertas Mar del Plata">
      <h1>Festival de Música</h1>
      <span class="band">Domingo 13 de diciembre · 20 hs</span>
      <p class="muted">Abbey Road · Juan B. Justo 620</p>
    </div>
    <p style="text-align:center;font-weight:600">¿Quién sos?</p>
    <div class="choices">
      <button class="btn" data-role="C">${icons.ticket}<span>Carolina<span class="sub">Vendo entradas</span></span></button>
      <button class="btn" data-role="M">${icons.ticket}<span>Marina<span class="sub">Vendo entradas</span></span></button>
      <button class="btn teal" data-role="door">${icons.door}<span>Estoy en la puerta<span class="sub">Escaneo las entradas</span></span></button>
    </div>
    <p class="muted small" style="text-align:center">El teléfono se acuerda de tu elección. Lo podés cambiar cuando quieras.</p>`;
}

async function render() {
  let html;
  if (state.role === "door") {
    if (!state.doorResult && canLive && !liveFailed && !liveStream) await startLive();
    html = renderDoor() + (state.doorResult ? renderResult() : state.draw ? renderDraw() : state.doorTicket ? renderDoorTicket() : "");
  } else {
    stopLive();
    html = SELLERS[state.role] ? renderSeller() : renderHome();
  }
  $app.innerHTML = `<div class="wrap">${html}</div>`;
  if (state.role === "door" && !state.doorResult && !state.draw && !state.doorTicket) attachLive();
}

// ---------- eventos ----------
$app.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-role]");
  if (!el) return;
  if (el.dataset.role) return setRole(el.dataset.role);
  const act = el.dataset.act;
  if (act === "home") { state.doorResult = null; state.draw = null; state.doorSell = false; state.doorTicket = null; setRole(null); }
  else if (act === "testTicket") createTestTicket();
  else if (act === "doorSell") { state.doorSell = true; render().then(() => document.getElementById("doorBuyer")?.focus()); }
  else if (act === "cancelDoorSell") { state.doorSell = false; render(); }
  else if (act === "closeDoorTicket") { state.doorTicket = null; render(); }
  else if (act === "share") shareTicket();
  else if (act === "new") { state.ticket = null; render(); }
  else if (act === "edit") { state.editing = true; render(); }
  else if (act === "reopen") showTicket(sold()[Number(el.dataset.i)]);
  else if (act === "nextGuest") { state.doorResult = null; render(); }
  else if (act === "askReset") { state.confirmReset = true; render(); }
  else if (act === "cancelReset") { state.confirmReset = false; render(); }
  else if (act === "doReset") doReset();
  else if (act === "draw") startDraw();
  else if (act === "closeDraw") { state.draw = null; render(); }
  else if (act === "undo") {
    const all = entries(); delete all[el.dataset.code]; save("ma.door", all);
    state.doorResult = null; render();
  }
});

$app.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "sellForm") {
    const name = document.getElementById("buyer").value.trim().replace(/\s+/g, " ");
    if (!name) { document.getElementById("sellErr").hidden = false; return; }
    const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
    await createTicket(name);
  } else if (e.target.id === "fixForm") {
    const n = parseInt(document.getElementById("fixNum").value, 10);
    if (!(n >= nextNumber())) { document.getElementById("fixErr").hidden = false; return; }
    save("ma.next." + state.role, n);
    state.editing = false; render();
  } else if (e.target.id === "manualForm") {
    const code = normalizeCode(document.getElementById("manualCode").value);
    if (!code) { document.getElementById("manualErr").hidden = false; return; }
    const prev = entries()[code];
    admit({ code, name: prev ? prev.name : "", p: 1 });
  } else if (e.target.id === "doorSellForm") {
    const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
    await sellAtDoor(document.getElementById("doorBuyer").value.trim().replace(/\s+/g, " "));
  }
});

document.getElementById("photo").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  onPhoto(f);
});

// pedirle al navegador que no borre lo guardado, y que la página abra aunque no haya señal
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
if ("serviceWorker" in navigator && location.protocol === "https:" && !window.claude) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

render();
</script>
</body></html>
